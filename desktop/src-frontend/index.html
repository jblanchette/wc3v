<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WC3V — local</title>
  <link rel="stylesheet" href="./css/spike.css">
</head>
<body>
  <header>
    <h1>WC3V <span class="tag">local · phase 0</span></h1>
    <div id="status" class="status">starting…</div>
  </header>

  <main>
    <section class="col">
      <h2>Replay folders</h2>
      <div id="roots"></div>
      <button id="pick-folder">Add folder…</button>
      <p class="hint">Map cache: <code id="cache-dir">—</code></p>

      <h2>Backfill</h2>
      <div id="backfill-status" class="hint">idle</div>
      <button id="backfill-toggle">Parse all replays</button>
      <button id="backfill-retry" hidden>Retry failed</button>
    </section>

    <section class="col wide">
      <h2>Replays <span class="hint">click to parse</span></h2>
      <div id="replays" class="scroll"></div>
    </section>

    <section class="col">
      <h2>Result</h2>
      <pre id="result" class="result"></pre>
      <h2>Log</h2>
      <div id="log" class="scroll log"></div>
    </section>
  </main>

  <!-- Shared summary extractor — the committed client copy, placed into
       js/vendor by tools/build-desktop-client.js. Must load before app.js. -->
  <script src="./js/vendor/SummaryExtract.js"></script>
  <script src="./js/backfill.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
