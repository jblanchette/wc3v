<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WC3V — open in the viewer</title>
<!--
  The bridge between WC3V on your machine and the viewer on wc3v.com.

  WHY THIS PAGE EXISTS. The obvious design — open wc3v.com and let it pull the
  replay from the loopback server — does not work. Chrome blocks a public page
  from reaching 127.0.0.1: measured against a live server, `fetch` hangs
  pending forever and an iframe ends in net::ERR_ABORTED. Both directions of
  that idea are dead.

  So the browser starts HERE, on the loopback origin, where reading the replay
  is same-origin and unremarkable. Then it opens wc3v.com and pushes the bytes
  across with postMessage — private → public, which browsers do allow, and a
  message channel needs no CORS at all.

  The one click is not decoration: window.open without a user gesture is
  popup-blocked. It is attempted automatically first, and the button is the
  fallback for when that is refused.

  Self-contained: no external fonts, scripts or requests. The only things it
  touches are its own origin and the window it opens.
-->
<style>
  /* Same carved register as the app: earthy, muted, no glow. */
  :root {
    --well: #0b0805;
    --panel: #17150f;
    --panel-2: #1e1b16;
    --line: #2f2819;
    --edge: #453a25;
    --ink: #E8E0D2;
    --ink-dim: #9A8F7D;
    --ink-faint: #6E6555;
    --gold: #E0A800;
    --bad: #A65340;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--well);
    color: var(--ink);
    font: 1rem/1.55 "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 34rem;
    padding: 2rem;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--edge);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.055), 0 10px 40px rgba(0,0,0,0.45);
    text-align: center;
  }
  .brand {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--gold);
    text-shadow: 0 1px 0 #000;
    margin-bottom: 1.25rem;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.6rem; }
  p { color: var(--ink-dim); margin-bottom: 1.25rem; overflow-wrap: anywhere; }
  .at { color: var(--ink); font-weight: 600; }
  button {
    min-height: 44px;
    padding: 0 1.6rem;
    background: linear-gradient(180deg, #7a5a24, #5c4319);
    border: 1px solid #8a6a2c;
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.055);
    color: #f4ead5;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: linear-gradient(180deg, #8a6729, #6a4d1d); }
  button[disabled] { opacity: 0.5; cursor: default; }
  .note { color: var(--ink-faint); font-size: 0.85rem; margin: 1.25rem 0 0; }
  .err { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">WC3V</div>
    <h1 id="head">Opening the viewer…</h1>
    <p id="lead">Handing this replay to wc3v.com. It never leaves your machine
      by any other route — there is no upload and no account.</p>
    <button id="go" class="hidden" type="button">Open the viewer</button>
    <p class="note" id="note">You can close this tab once the viewer opens.</p>
  </div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var handoffId = params.get('h') || '';
  var at = params.get('at') || '';
  var key = params.get('key') || '';

  var SITE = 'https://wc3v.com';
  var el = function (id) { return document.getElementById(id); };

  function fail (headline, detail) {
    el('head').textContent = headline;
    el('head').className = 'err';
    el('lead').textContent = detail;
    el('go').classList.add('hidden');
    el('note').textContent = '';
  }

  var bytesPromise = fetch('/handoff?token=' + encodeURIComponent(token) +
                           '&h=' + encodeURIComponent(handoffId))
    .then(function (r) {
      if (!r.ok) throw new Error('handoff ' + r.status);
      return r.arrayBuffer();
    });

  // The child announces itself when it is ready to receive; we answer with the
  // bytes. Doing it this way round removes the race entirely — there is no
  // guessing how long the site takes to load.
  var child = null;
  window.addEventListener('message', function (e) {
    if (e.origin !== SITE) return;
    if (!e.data || e.data.type !== 'wc3v-handoff-ready') return;
    bytesPromise.then(function (buf) {
      // Transferred, not copied — a replay is a few hundred KB and this is the
      // whole point of the message channel.
      e.source.postMessage({ type: 'wc3v-handoff', buffer: buf, at: at, key: key }, SITE, [buf]);
      el('head').textContent = 'Sent';
      el('lead').textContent = 'The viewer is reading the replay now. This can ' +
        'take a few seconds the first time you open a game.';
      el('go').classList.add('hidden');
    }).catch(function () {
      fail('That replay is no longer staged',
        'Click Watch again in WC3V — staged replays are dropped after ten minutes.');
    });
  });

  function openViewer () {
    // `o` is this page's own origin, so the site can postMessage back to an
    // exact target instead of a wildcard. It cannot know the port otherwise —
    // the overlay server binds whatever it can keep across restarts.
    var url = SITE + '/handoff?from=wc3v-desktop' +
      '&o=' + encodeURIComponent(location.origin) +
      (at ? '&at=' + encodeURIComponent(at) : '') +
      (key ? '&key=' + encodeURIComponent(key) : '');
    child = window.open(url, 'wc3v-viewer');
    if (!child) {
      el('head').textContent = 'One more click';
      el('lead').textContent = 'Your browser blocked the pop-up, which it does ' +
        'for anything it did not see you click.';
      el('go').classList.remove('hidden');
      return false;
    }
    el('go').classList.add('hidden');
    return true;
  }

  el('go').addEventListener('click', openViewer);

  // Fail early and clearly if the staged replay is already gone, rather than
  // opening the site and stranding it waiting for bytes that never arrive.
  bytesPromise
    .then(function () { openViewer(); })
    .catch(function () {
      fail('That replay is no longer staged',
        'Click Watch again in WC3V — staged replays are dropped after ten minutes.');
    });
})();
</script>
</body>
</html>
