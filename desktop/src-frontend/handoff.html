<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WC3V — open in the viewer</title>
<!--
  The bridge between WC3V on your machine and the viewer on wc3v.com.

  WHY THIS PAGE EXISTS. The obvious design — open wc3v.com and let it pull the
  replay from the loopback server — does not work. Chrome blocks a public page
  from reaching 127.0.0.1: measured against a live server, `fetch` hangs
  pending forever and an iframe ends in net::ERR_ABORTED. Both directions of
  that idea are dead.

  So the browser starts HERE, on the loopback origin, where reading the replay
  is same-origin and unremarkable. Then it opens wc3v.com and pushes the bytes
  across with postMessage — private → public, which browsers do allow, and a
  message channel needs no CORS at all.

  The click is the mechanism, not a confirmation step. window.open without a
  user gesture is pop-up blocked, and on a loopback origin the browser has no
  engagement history to make an exception for — so it is blocked every time,
  not occasionally. Nothing here opens a window on its own.

  Self-contained: no external fonts, scripts or requests. The only things it
  touches are its own origin and the window it opens.
-->
<style>
  /* The site's navy chrome, NOT the app's warm body — deliberately.
     This page is one of three the user sees back to back: this, then
     wc3v.com/handoff, then the viewer. The other two are navy, and a warm
     carved card in the middle of that run reads as a different product.
     Values are copied rather than imported because the page has to stay
     self-contained (it is served from the loopback binary). They mirror
     client/css/tokens.css. */
  :root {
    --well: #12131f;
    --panel: #1a1d2e;
    --panel-2: #212538;
    --edge: rgba(255,255,255,0.14);
    --ink: #e8eaf0;
    --ink-dim: #9ca3b8;
    --ink-faint: #6b7290;
    --accent: #5B8DEF;
    --bad: #E2725B;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--well);
    color: var(--ink);
    font: 1rem/1.55 "Segoe UI", system-ui, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 34rem;
    padding: 2rem;
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--edge);
    border-radius: 10px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.055), 0 10px 40px rgba(0,0,0,0.45);
    text-align: center;
  }
  /* The canonical lockup, same as the app bar and client/handoff.html. */
  .brand {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 1.25rem;
  }
  .brand > span { color: var(--accent); }
  h1 { font-size: 1.4rem; margin-bottom: 0.6rem; }
  p { color: var(--ink-dim); margin-bottom: 1.25rem; overflow-wrap: anywhere; }
  .at { color: var(--ink); font-weight: 600; }
  button {
    min-height: 44px;
    padding: 0 1.6rem;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: #0d1220;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #7BA5F3; border-color: #7BA5F3; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[disabled] { opacity: 0.5; cursor: default; }
  .note { color: var(--ink-faint); font-size: 0.85rem; margin: 1.25rem 0 0; }
  .err { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">WC<span>3</span>V</div>
    <h1 id="head">Ready to open</h1>
    <p id="lead">This game goes straight from WC3V on your machine into the
      viewer. There is no upload and no account.</p>
    <button id="go" type="button" disabled>Open in the viewer</button>
    <p class="note" id="note">You can close this tab afterwards.</p>
  </div>

<script>
(function () {
  'use strict';

  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var handoffId = params.get('h') || '';
  var at = params.get('at') || '';
  var key = params.get('key') || '';

  var SITE = 'https://wc3v.com';
  var el = function (id) { return document.getElementById(id); };

  function fail (headline, detail) {
    el('head').textContent = headline;
    el('head').className = 'err';
    el('lead').textContent = detail;
    el('go').classList.add('hidden');
    el('note').textContent = '';
  }

  var bytesPromise = fetch('/handoff?token=' + encodeURIComponent(token) +
                           '&h=' + encodeURIComponent(handoffId))
    .then(function (r) {
      if (!r.ok) throw new Error('handoff ' + r.status);
      return r.arrayBuffer();
    });

  // The child announces itself when it is ready to receive; we answer with the
  // bytes. Doing it this way round removes the race entirely — there is no
  // guessing how long the site takes to load.
  var child = null;
  window.addEventListener('message', function (e) {
    if (e.origin !== SITE) return;
    if (!e.data || e.data.type !== 'wc3v-handoff-ready') return;
    bytesPromise.then(function (buf) {
      // Transferred, not copied — a replay is a few hundred KB and this is the
      // whole point of the message channel.
      e.source.postMessage({ type: 'wc3v-handoff', buffer: buf, at: at, key: key }, SITE, [buf]);
      el('head').textContent = 'Sent';
      el('lead').textContent = 'The viewer is reading the replay now. This can ' +
        'take a few seconds the first time you open a game.';
      el('go').classList.add('hidden');
    }).catch(function () {
      fail('That replay is no longer staged',
        'Click Watch again in WC3V — staged replays are dropped after ten minutes.');
    });
  });

  // Opened ONLY from a real click. An earlier version tried this automatically
  // on load and kept the button as a fallback — which meant the browser blocked
  // it every single time (a freshly-opened loopback origin has no engagement
  // history, so there is nothing for it to trust), raised its blocked-pop-up
  // indicator, and left this page explaining away a prompt it had caused
  // itself. The automatic attempt never once succeeded; it only ever produced
  // the warning. A click is the whole mechanism now.
  function openViewer () {
    // `o` is this page's own origin, so the site can postMessage back to an
    // exact target instead of a wildcard. It cannot know the port otherwise —
    // the overlay server binds whatever it can keep across restarts.
    var url = SITE + '/handoff?from=wc3v-desktop' +
      '&o=' + encodeURIComponent(location.origin) +
      (at ? '&at=' + encodeURIComponent(at) : '') +
      (key ? '&key=' + encodeURIComponent(key) : '');
    // Named, so clicking a second time reuses the same tab instead of piling
    // viewers up.
    child = window.open(url, 'wc3v-viewer');
    el('go').disabled = true;
    el('head').textContent = 'Opening…';
  }

  el('go').addEventListener('click', openViewer);

  // Check the staged replay is still there BEFORE offering the button, rather
  // than opening the site and stranding it waiting for bytes that never come.
  // This is a same-origin read from memory, so the wait is imperceptible.
  bytesPromise
    .then(function () {
      el('go').disabled = false;
      el('go').focus();
    })
    .catch(function () {
      fail('That replay is no longer staged',
        'Click Watch again in WC3V — staged replays are dropped after ten minutes.');
    });
})();
</script>
</body>
</html>
