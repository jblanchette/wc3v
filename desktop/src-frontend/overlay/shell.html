<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WC3V overlay</title>
<!--
  Served by the Rust loopback server, which inlines overlay.css, the two icon
  modules and overlay-render.js into this shell at request time (they are
  separate files so the live preview inside the WC3V window can render from
  exactly the same source, because a preview drawn by different code is a
  preview that can lie).

  Rendered by an OBS Browser Source or an ordinary browser tab (player view).
  No external scripts, fonts or stylesheets. Two network origins and no others:
  the same-origin EventSource this page opens, and hero portraits from
  cdn.wc3v.com, which blank themselves and hold their layout when the machine
  is offline.

  URL params:
    token    required
    view     obs | panel        (panel = opaque background, for a monitor)
    theme    carved | slate
    scale    number, 0.4–4
    modules  comma list: scout,session,verdict,report,momentum,h2h,moments,build
    reveal   seconds to hold the full card after a game (absent = always on)
-->
<style>
  html { font-size: 16px; }
  body { background: transparent; padding: 0.5rem; margin: 0; }
  body[data-view="panel"] { background: #0f0d0a; min-height: 100vh; }
/*OVERLAY_CSS*/
</style>
</head>
<body>
  <div id="ov"></div>
<script>
/*RACE_ICONS_JS*/
</script>
<script>
/*GLYPHS_JS*/
</script>
<script>
/*OVERLAY_RENDER_JS*/
</script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  document.body.dataset.view = params.get('view') === 'panel' ? 'panel' : 'obs';
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
  var scale = parseFloat(params.get('scale'));
  if (scale > 0.4 && scale < 4) document.documentElement.style.fontSize = (16 * scale) + 'px';

  // An unrecognised module name is dropped rather than failing the page: an
  // older overlay URL pasted into OBS keeps working after a rename.
  var mods = (params.get('modules') || '').split(',')
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return window.OverlayRender.ALL_MODULES.indexOf(s) !== -1; });

  // Reveal mode: stay out of the way, show the full card when a game lands,
  // hold, then collapse back. `hold` is in seconds; without the param the card
  // is simply always on, which is what every existing pasted URL keeps meaning.
  var hold = parseInt(params.get('reveal'), 10);
  var reveals = hold > 0;
  var lastGameId = null;
  var hideTimer = null;

  var root = document.getElementById('ov');
  if (reveals) {
    document.body.dataset.reveal = 'on';
    document.body.dataset.phase = 'idle';
  }

  // After the hold, the card COLLAPSES rather than vanishing: `post` modules
  // hide and the scout/session strip stays on screen, which is a scene element
  // that keeps its place instead of a graphic that appears from nowhere.
  //
  // Unless there is no strip to collapse to. A single-panel source
  // (`modules=verdict&reveal=20`) is all post, so it keeps the old slide-out —
  // otherwise those URLs would hold an empty box on somebody's broadcast
  // forever.
  function hasStrip () { return !!root.querySelector('.mod:not(.post)'); }

  function rest () {
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    document.body.dataset.phase = 'idle';
    document.body.dataset.shown = hasStrip() ? 'yes' : 'no';
  }

  function showFor (seconds) {
    document.body.dataset.phase = 'post';
    document.body.dataset.shown = 'yes';
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(rest, seconds * 1000);
  }

  var es = new EventSource('/events?token=' + encodeURIComponent(token));
  es.onmessage = function (e) {
    var state;
    try {
      state = JSON.parse(e.data);
    } catch (err) { return; }   // partial state; wait for the next one
    try {
      window.OverlayRender.render(root, state, mods);
    } catch (err) { return; }

    if (!reveals) return;
    var id = state.game && state.game.gameId;
    if (!id) {
      // No game yet. The strip is all there is to show, so show it.
      rest();
      return;
    }
    // A NEW game, not the same one republished. Identity changes and
    // reconnects both resend everything, and a timestamp cannot tell them
    // apart, because every publish carries a fresh one.
    //
    // On a fresh load lastGameId is null, so the last game reveals once and
    // then collapses: that is deliberate, it is the only way to position the
    // source in OBS without playing a match. It also makes the mode
    // reload-safe, so OBS's "refresh on scene activate" replays this.
    if (id !== lastGameId) {
      lastGameId = id;
      showFor(hold);
    } else if (!hideTimer) {
      // A republish while resting — the same game re-sent after an identity
      // change. Re-settle rather than leaving the strip hidden because the
      // card it was measured against has been rebuilt.
      rest();
    }
  };
})();
</script>
</body>
</html>
