[package]
name = "wc3v-desktop"
# Kept in step with tauri.conf.json by `node tools/version-check.js`, which the
# desktop build and the deploy both run. Nothing reads this one: the bundle, the
# updater manifest and the download page all take their version from
# tauri.conf.json. That is exactly why it drifted for most of the project's life
# (0.6.0 here against a shipped 0.7.4, then 1.0.2 against a live 1.0.3) and why
# a tool checks it now instead of a comment asking someone to remember.
version = "1.0.9"
description = "WC3V — local replay auto-parse and overlay"
authors = ["Jeff Blanchette"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Run-on-startup. Writes a registry Run key on Windows / a .desktop entry on
# Linux — the app never installs a service or elevates.
tauri-plugin-autostart = "2"

# Post-game toast. Fires ONLY for a game the watcher detected — a backfill
# would otherwise produce one notification per replay, thousands of them.
tauri-plugin-notification = "2"

# Signed delta-free updates pulled from a static manifest (see RELEASING.md).
# The ONLY component that makes an outbound request, and only when the user
# asks or on the once-per-launch check.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# One app, one process. Closing the window hides to tray, so a second launch
# used to be invisible until it did damage: a second tray icon, a second
# watcher re-parsing and re-notifying the same games, and — worst — a second
# overlay server that walks past the taken home port onto the ladder, leaving
# the URL already pasted into OBS pointed at the first instance. The plugin
# hands its argv to the running app and exits, before any of that starts.
tauri-plugin-single-instance = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Filesystem watching for the replay folders. `notify` is the crate behind
# tauri-plugin-fs's watch support; used directly so the watcher can own its
# own debounce and hashing rather than round-tripping every raw event to JS.
notify = "6"
dirs = "5"

# Dedupe hash. This is not a security boundary — it only answers "are these
# two local files the same game", so a cryptographic hash is the wrong tool.
# sha2 managed 114 MB/s in release and 15 MB/s in debug (it does not use the
# CPU's SHA extensions by default), which made the first scan take seconds.
# xxh3 runs at several GB/s, and it is combined with file size so a collision
# would have to match both.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Fetching map parse data for a map the installer did not bundle. Already in
# the tree via tauri-plugin-updater, so this costs nothing new.
#
# The `gzip` feature is deliberately NOT enabled, and must never be: the CDN
# stores `.json.gz` WITH `Content-Encoding: gzip` (tools/deploy-assets.js), so
# a client that transparently decompresses would hand back plain JSON, which
# the map cache would then store under a `.gz` name and the parser would fail
# to inflate. The raw bytes off the wire ARE the file we want on disk.
# (Same reasoning rules out `deflate`, `brotli` and `zstd`.)
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[features]
# Tauri's default CSP/devtools split. Nothing custom yet.
default = []

[profile.release]
# Small binary is a product goal, not just tidiness — the whole pitch is an
# installer that carries nothing it doesn't need.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
