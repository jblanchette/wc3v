# Desktop release build.
#
# Builds the NSIS installer exactly the way `npm run desktop:build` does
# locally and publishes it as a build artifact.
#
# The installer is NOT Authenticode-signed. SignPath Foundation declined the
# project's application in August 2026, and paid signing was not taken up, so
# there is no certificate to sign with. Distribution instead leans on
# client/install.ps1: PowerShell does not apply the Mark of the Web, so the
# SmartScreen prompt never fires, and the script verifies the SHA-256 from
# latest.json before running anything. The FAQ at the foot of
# client/download.html says all of this to users.
#
# What happens after this workflow is deliberately manual — see
# desktop/README.md "Releasing": download the artifact, then
# `node tools/deploy-desktop.js --notes="..."` to publish installer + manifest
# to R2.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   contents of ~/.tauri/wc3v-updater.key — the
#                               minisign updater keypair. This signs the UPDATE
#                               MANIFEST, and is unrelated to code signing.

name: desktop-release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build desktop client (bundled ladder maps)
        # --fetch-maps: CI has no client/maps (parse caches are CDN-hosted,
        # not in git); the frozen set in desktop/installer-maps.json is
        # downloaded from cdn.wc3v.com before staging.
        run: node tools/build-desktop-client.js --bundle-maps=ladder --fetch-maps

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes "@tauri-apps/cli@^2" build

      # The .sig alongside the exe is the minisign updater signature, and
      # tools/deploy-desktop.js refuses to publish without it.
      - name: Publish installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: wc3v-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/WC3V_${{ steps.version.outputs.version }}_x64-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/WC3V_${{ steps.version.outputs.version }}_x64-setup.exe.sig
          if-no-files-found: error
