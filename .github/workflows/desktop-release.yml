# Desktop release build — the SignPath path.
#
# SignPath Foundation signs open-source binaries ONLY when they come from a
# trusted build system it can verify, which for this repo is GitHub Actions.
# This workflow builds the NSIS installer exactly the way `npm run
# desktop:build` does locally, publishes it as a build artifact, and then (once
# the SignPath secrets exist) submits it for Authenticode signing and publishes
# the SIGNED installer as a second artifact.
#
# What happens after this workflow is deliberately manual — see
# desktop/README.md "Releasing, signed": download the signed installer, then
# `node tools/deploy-desktop.js --installer=<signed.exe> --notes="..."`, which
# regenerates the Tauri updater signature against the signed bytes (Authenticode
# changes the file, so the .sig made at build time no longer matches) and
# publishes installer + manifest to R2.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY   contents of ~/.tauri/wc3v-updater.key — the
#                               updater keypair, NOT the Authenticode cert
#   SIGNPATH_API_TOKEN          from the SignPath dashboard (after approval)
# Variables:
#   SIGNPATH_ORG_ID             the SignPath organization id
#   SIGNPATH_PROJECT_SLUG       e.g. wc3v-desktop
#   SIGNPATH_POLICY_SLUG        e.g. release-signing
#
# Until the SignPath pieces exist the workflow still runs and produces the
# unsigned artifact, so the build path can be proven before the application is
# even approved.

name: desktop-release

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build desktop client (bundled ladder maps)
        # --fetch-maps: CI has no client/maps (parse caches are CDN-hosted,
        # not in git); the frozen set in desktop/installer-maps.json is
        # downloaded from cdn.wc3v.com before staging.
        run: node tools/build-desktop-client.js --bundle-maps=ladder --fetch-maps

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installer
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx --yes "@tauri-apps/cli@^2" build

      - name: Publish unsigned installer artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wc3v-installer-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/WC3V_${{ steps.version.outputs.version }}_x64-setup.exe
          if-no-files-found: error

      # ── SignPath ─────────────────────────────────────────────────────────
      # Skipped cleanly until the token exists. `secrets` cannot be read in an
      # `if:` directly, so it goes through env first.
      - name: Check SignPath configured
        id: signpath
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Submit for code signing
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Publish signed installer artifact
        if: steps.signpath.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wc3v-installer-signed
          path: signed/
          if-no-files-found: error
