<!DOCTYPE html>
<html>
  <head>
    <title>WC3V — Replay Viewer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.9.7/d3.min.js"></script>
    <script src="https://unpkg.com/rbush@2.0.1/rbush.min.js"></script>

    <script src="/js/Helpers.js?v=5.03"></script>
    <script src="/js/Drawing.js?v=5.06"></script>
    <script src="/js/Constants.js?v=5.03"></script>

    <script src="/js/TimeScrubber.js?v=5.03"></script>
    <script src="/js/GameScaler.js?v=5.05"></script>
    <script src="/js/ClientUnit.js?v=5.03"></script>
    <script src="/js/ClientPlayer.js?v=5.03"></script>
    <script src="/js/GameDisplayBox.js?v=5.06"></script>
    <script src="/js/gameData.js?v=5.03"></script>

    <script src="/js/BuildOrderData.js?v=5.04"></script>
    <script src="/js/MapRenderer.js?v=5.07"></script>
    <script src="/js/TimelineSpline.js?v=5.04"></script>
    <script src="/js/BuildOrderRenderer.js?v=5.04"></script>
    <script src="/js/MatchHeader.js?v=5.04"></script>

    <script src="/js/app.js?v=5.07"></script>
    <script src="/js/SiteNav.js"></script>

    <script>
      document.addEventListener('DOMContentLoaded', (event) => {
        SiteNav.render(null);
        wc3v.bootstrap();
      });
    </script>

    <style type="text/css">
      @import "/css/main.css?v=5.06";
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body style="overflow-y: hidden;">

    <div id="app" class="layout-mode-live-bo">
      <div id="content">
        <div id="gameplay-area">
          <div id="match-header" style="display:none;">
            <div class="mh-matchup">
              <div class="mh-player mh-player-left"></div>
              <div class="mh-player mh-player-right"></div>
            </div>

            <div class="mh-toolbar">
              <div class="mh-map-info">
                <span class="mh-map-name"></span>
              </div>
              <div class="mh-toggles" id="mh-viewer-toggles"></div>
            </div>
          </div>
          <div id="gameplay-row">
            <div id="player-status-wrapper">
              <div id="player-status-toggles">
                <div id="heroes-toggle"
                  onClick="wc3v.setStatusTab('heroes')" class="status-toggle selected">Heroes</div>
                <div id="units-toggle"
                  onClick="wc3v.setStatusTab('units')" class="status-toggle">Selection</div>
                <div id="groups-toggle"
                  onClick="wc3v.setStatusTab('groups')" class="status-toggle">Groups</div>
              </div>
              <canvas id="player-status-canvas" width="265" height="200"></canvas>
            </div>

            <div id="map-container">
              <div id="main-wrapper">
                <div id="mega-play-overlay">
                  <div id="mega-play-button" onClick="wc3v.play()"></div>
                  <div id="mega-play-hints">
                    <div id="mega-play-hints-title">View Options</div>
                    <div class="mega-hint on" data-option="displayCreepRoute" onClick="wc3v.toggleViewOption('displayCreepRoute')">Creep Routes<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint" data-option="displayPath" onClick="wc3v.toggleViewOption('displayPath')">Hero Paths<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayText" onClick="wc3v.toggleViewOption('displayText')">Unit Names<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayLeveLDots" onClick="wc3v.toggleViewOption('displayLeveLDots')">Level Dots<span class="mega-hint-icon"></span></div>
                  </div>
                </div>

                <div id="canvas-group">
                  <canvas id="main-canvas" width="550" height="650"></canvas>
                  <canvas id="player-canvas" width="550" height="650"></canvas>
                  <canvas id="utility-canvas" width="550" height="650"></canvas>
                </div>

                <img id="loading-icon" src="/assets/loading-icon.svg" />

                <div id="game-display-box"></div>

                <div id="match-complete-banner">
                  <div class="mcb-text">Match Complete</div>
                  <div class="mcb-restart" onClick="wc3v.restart()">Replay Again</div>
                </div>

                <div id="empty-game-wrapper">
                  <div class="empty-game-label">No replay loaded.</div>
                  <a href="/builds" class="empty-game-browse">Browse Build Orders →</a>
                </div>
              </div>
              <div id="scrubber-bar"></div>
            </div>
          </div>
        </div>

        <div id="build-area">
          <div id="build-wrapper">
            <div id="bo-content">
              <div id="bo-columns">
                <div class="bo-side bo-side-left"></div>
                <div id="bo-timeline-gap"></div>
                <div class="bo-side bo-side-right"></div>
              </div>
            </div>
            <div id="bo-empty">
              <span>Load a replay to view the build order.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
