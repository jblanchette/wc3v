<!DOCTYPE html>
<html>
  <head>
    <title>WC3V — Replay Viewer</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.9.7/d3.min.js"></script>
    <script src="https://unpkg.com/rbush@2.0.1/rbush.min.js"></script>

    <script>
      // dev cache buster — forces fresh loads every page load
      const _t = Date.now();
      const _scripts = [
        '/js/Helpers.js',
        '/js/Drawing.js',
        '/js/Constants.js',
        '/js/TimeScrubber.js',
        '/js/GameScaler.js',
        '/js/ClientUnit.js',
        '/js/ClientPlayer.js',
        '/js/GameDisplayBox.js',
        '/js/gameData.js',
        '/js/BuildOrderData.js',
        '/js/MapRenderer.js',
        '/js/TimelineSpline.js',
        '/js/BuildOrderRenderer.js',
        '/js/ChapterMarkers.js',
        '/js/FloatingText.js',
        '/js/BuildingPlacementViewer.js',
        '/js/MatchHeader.js',
        '/js/app.js',
        '/js/SiteNav.js'
      ];
      _scripts.forEach(src => {
        document.write('<script src="' + src + '?t=' + _t + '"><\/script>');
      });
    </script>

    <script>
      document.addEventListener('DOMContentLoaded', (event) => {
        SiteNav.render(null);
        wc3v.bootstrap();
      });
    </script>

    <style type="text/css">
      @import "/css/main.css?v=5.06";
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body style="overflow-y: hidden;">

    <div id="app" class="layout-mode-live-bo">
      <div id="content">
        <div id="gameplay-area">
          <div id="match-header" style="display:none;">
            <div class="mh-matchup">
              <div class="mh-player mh-player-left"></div>
              <div class="mh-player mh-player-right"></div>
            </div>
          </div>
          <div id="gameplay-row">
            <div id="player-status-wrapper">
              <div id="player-status-toggles">
                <div id="heroes-toggle"
                  onClick="wc3v.setStatusTab('heroes')" class="status-toggle selected">Heroes</div>
                <div id="units-toggle"
                  onClick="wc3v.setStatusTab('units')" class="status-toggle">Selection</div>
                <div id="groups-toggle"
                  onClick="wc3v.setStatusTab('groups')" class="status-toggle">Groups</div>
              </div>
              <canvas id="player-status-canvas" width="265" height="200"></canvas>
            </div>

            <div id="map-container">
              <div id="main-wrapper">
                <div id="map-name-overlay"></div>
              <div id="mega-play-overlay">
                  <div id="mega-play-title-group">
                    <div id="mega-play-title">Watch Rewindable Replay</div>
                    <div id="mega-play-title-logo" onClick="wc3v.play()"><img src="/assets/wc3v.svg" alt="WC3V" /><img src="/assets/play-icon.svg" alt="Play" class="logo-play-icon" /></div>
                  </div>
                  <div id="mega-play-button" onClick="wc3v.play()"></div>
                  <div id="mega-play-hints">
                    <div id="mega-play-hints-title">View Options</div>
                    <div class="mega-hint mega-hint-featured on" data-option="displayCreepRoute" onClick="wc3v.toggleViewOption('displayCreepRoute')">Creep Routes<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayPath" onClick="wc3v.toggleViewOption('displayPath')">Hero Paths<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayLevelPins" onClick="wc3v.toggleViewOption('displayLevelPins')">Level Pins<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayFloatingText" onClick="wc3v.toggleViewOption('displayFloatingText')">Action Text<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayText" onClick="wc3v.toggleViewOption('displayText')">Unit Names<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="decayEffects" onClick="wc3v.toggleViewOption('decayEffects')">Fade FX<span class="mega-hint-icon"></span></div>
                    <div class="mega-hint on" data-option="displayTreeGrid" onClick="wc3v.toggleViewOption('displayTreeGrid')">Tree Grid<span class="mega-hint-icon"></span></div>
                  </div>
                </div>

                <div id="canvas-group">
                  <canvas id="main-canvas" width="550" height="650"></canvas>
                  <canvas id="player-canvas" width="550" height="650"></canvas>
                  <canvas id="utility-canvas" width="550" height="650"></canvas>
                </div>

                <img id="loading-icon" src="/assets/loading-icon.svg" />

                <div id="game-display-box"></div>
                <button id="debug-pathing-btn" style="position:absolute;top:4px;right:4px;z-index:9999;padding:4px 8px;font-size:11px;background:#c00;color:#fff;border:none;cursor:pointer;border-radius:3px;" onclick="wc3v.debugPathingDump()">Debug Pathing</button>

                <div id="match-complete-banner">
                  <div class="mcb-text">Match Complete</div>
                  <div class="mcb-restart" onClick="wc3v.restart()">Replay Again</div>
                </div>

                <div id="empty-game-wrapper">
                  <div class="empty-game-label">No replay loaded.</div>
                  <a href="/builds" class="empty-game-browse">Browse Build Orders →</a>
                </div>
              </div>
              <div id="scrubber-bar"></div>
            </div>
          </div>
        </div>

        <div id="build-area">
          <div id="build-wrapper">
            <div id="bo-content">
              <div id="bo-columns">
                <div class="bo-side bo-side-left"></div>
                <div id="bo-timeline-gap"></div>
                <div class="bo-side bo-side-right"></div>
              </div>
            </div>
            <div id="bo-empty">
              <span>Load a replay to view the build order.</span>
            </div>
          </div>

          <div id="placement-viewer-modal" style="display:none;">
            <div class="placement-viewer-panel">
              <div class="placement-viewer-header">
                <span class="placement-viewer-title">Building Placement</span>
                <span class="placement-viewer-close">&times;</span>
              </div>
              <div class="placement-viewer-canvas"></div>
              <div class="placement-viewer-controls"></div>
              <div class="placement-viewer-label"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
