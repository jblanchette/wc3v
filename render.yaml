services:
  - type: web
    runtime: static
    name: wc3v
    staticPublishPath: ./client
    pullRequestPreviewsEnabled: true
    # Content-hash the JS/CSS before publishing: rewrites the ?v=… query
    # strings in client/*.html (and viewer.html's dev cache buster) to a
    # per-deploy hash, and emits client/asset-manifest.json. This is what
    # makes the `immutable` Cache-Control on /js/* and /css/* safe — a new
    # deploy changes the hash, so browsers re-fetch. Uses only Node built-ins
    # (no npm install needed). If this command fails the deploy fails, which
    # is safe (the previous deploy keeps serving).
    buildCommand: node tools/gen-builds-cards.js && node tools/gen-asset-manifest.js
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # HTML must always revalidate so a deploy is picked up on the next
      # navigation. Without this, browsers heuristic-cache HTML for ~10% of
      # its age and Cloudflare edge-caches per its own defaults — both have
      # caused stale-content reports after deploys.
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # JS/CSS are content-versioned (?v=<hash> rewritten by the buildCommand
      # above), so they can be cached hard. A new deploy = new hash = new URL.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # builds-cards.json is fetched with ?v=<bundleVersion> (gen-asset-
      # manifest hashes it into the marker the homepage reads), so a data
      # change = new URL = re-fetch — safe to cache hard. Do NOT add a
      # blanket /data/* immutable rule: the per-replay summaries below are
      # unversioned and load lazily.
      - path: /data/builds-cards.json
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/summaries/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Fetched unversioned on every viewer load (build badges / replay
      # switcher) — previously had NO rule, so caching was heuristic.
      - path: /data/builds-manifest.json
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Static game-balance lookup; changes only with a data regen.
      - path: /data/unit-balance-lite.json
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
      # The parser worker + its bundle are loaded by importScripts()/new Worker()
      # WITHOUT a ?v= query (can't self-reference the hash), so they must keep a
      # revalidating TTL rather than being immutable. They change rarely.
      - path: /js/parser-worker.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Loaded via new Worker() without a ?v= query (can't self-reference the
      # hash), so it revalidates rather than being immutable. Changes rarely.
      - path: /js/replay-json-worker.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /js/vendor/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # The asset manifest itself is the index of hashes — never cache it.
      - path: /asset-manifest.json
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Keep the non-content pages out of the index at the HTTP layer as well
      # as in a meta tag. The header is the belt: it reaches non-HTML files, it
      # survives a page being served to a crawler that stops reading before
      # </head>, and it cannot be lost when someone edits a template. /dev/* is
      # the model/FX bench rig — it was fully public and indexable until now.
      - path: /dev/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /handoff.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /compare.html
        name: X-Robots-Tag
        value: noindex
      # Per-user replay library. Already noindex in the meta tag; the sitemap
      # entry contradicting that is removed in the generated sitemap.
      - path: /replays.html
        name: X-Robots-Tag
        value: noindex
      # ── What Render actually does (measured 2026-08-11, commit 7ad3b3a) ────
      # Seven questions the agent-discovery work depended on. Answers, so the
      # next person does not have to redeploy to find out:
      #
      #   client/.well-known/ survives the publish ................. YES
      #   nested client/.well-known/mcp/ survives .................. YES
      #   `headers:` can override an inferred Content-Type ......... YES (cleanly
      #       replaces it, does not append a second header — see the rule below)
      #   .md files are served as ................................... text/markdown; charset=utf-8
      #   404.html is auto-served on a miss, with a real 404 status . YES
      #   `type: rewrite` with a leading dot in the source .......... NO (404)
      #   `type: redirect` from a path that EXISTS on disk .......... NO — see below
      #
      # The last one is the load-bearing one. Render resolves a static file
      # FIRST, including its clean-URL fallback (/foo serves foo.html), and only
      # consults `routes:` when nothing resolves. That is why the R2 redirects
      # below work (those paths are gitignored, nothing is on disk) and why a
      # `/about.html -> /about` redirect silently does nothing. Extensionless URL
      # normalization therefore cannot happen here; it needs a Cloudflare
      # Redirect Rule at the edge, which runs before the origin is reached.
      #
      # Render types extensionless files as binary/octet-stream, so RFC 9727's
      # required media type has to be forced. This rule is what makes
      # /.well-known/api-catalog servable from a static host at all.
      - path: /.well-known/api-catalog
        name: Content-Type
        value: application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"
    routes:
      # Heavy assets are hosted on R2 at cdn.wc3v.com. The client code uses
      # root-relative paths (e.g. /assets/wc3icons/foo.jpg, /maps/X/map.jpg)
      # so they "just work" in dev — these 301 redirects send production
      # traffic to R2. Browsers cache the redirect, so per-asset overhead
      # is one extra hop on first request only.
      - type: redirect
        source: /assets/wc3icons/*
        destination: https://cdn.wc3v.com/assets/wc3icons/*
      - type: redirect
        source: /assets/models/*
        destination: https://cdn.wc3v.com/assets/models/*
      - type: redirect
        source: /assets/textures/*
        destination: https://cdn.wc3v.com/assets/textures/*
      - type: redirect
        source: /assets/terrain/*
        destination: https://cdn.wc3v.com/assets/terrain/*
      - type: redirect
        source: /assets/press/*
        destination: https://cdn.wc3v.com/assets/press/*
      - type: redirect
        source: /maps/*
        destination: https://cdn.wc3v.com/maps/*
      - type: redirect
        source: /replays/*
        destination: https://cdn.wc3v.com/replays/*
