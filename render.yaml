services:
  - type: web
    runtime: static
    name: wc3v
    staticPublishPath: ./client
    pullRequestPreviewsEnabled: true
    # Content-hash the JS/CSS before publishing: rewrites the ?v=… query
    # strings in client/*.html (and viewer.html's dev cache buster) to a
    # per-deploy hash, and emits client/asset-manifest.json. This is what
    # makes the `immutable` Cache-Control on /js/* and /css/* safe — a new
    # deploy changes the hash, so browsers re-fetch. Uses only Node built-ins
    # (no npm install needed). If this command fails the deploy fails, which
    # is safe (the previous deploy keeps serving).
    # Order matters. gen-seo reads builds-manifest.json (and the cards output),
    # and emits client/builds/*.html plus the markdown twins; gen-asset-manifest
    # then content-hashes everything and rewrites the ?v= busters in all of it,
    # generated pages included. Running gen-seo last would leave the 16 build
    # pages with unversioned, immutably-cached CSS.
    buildCommand: >-
      node tools/gen-builds-cards.js &&
      node tools/gen-seo.js &&
      node tools/gen-asset-manifest.js
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # HTML must always revalidate so a deploy is picked up on the next
      # navigation. Without this, browsers heuristic-cache HTML for ~10% of
      # its age and Cloudflare edge-caches per its own defaults — both have
      # caused stale-content reports after deploys.
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # JS/CSS are content-versioned (?v=<hash> rewritten by the buildCommand
      # above), so they can be cached hard. A new deploy = new hash = new URL.
      - path: /js/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /css/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # builds-cards.json is fetched with ?v=<bundleVersion> (gen-asset-
      # manifest hashes it into the marker the homepage reads), so a data
      # change = new URL = re-fetch — safe to cache hard. Do NOT add a
      # blanket /data/* immutable rule: the per-replay summaries below are
      # unversioned and load lazily.
      - path: /data/builds-cards.json
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/summaries/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Fetched unversioned on every viewer load (build badges / replay
      # switcher) — previously had NO rule, so caching was heuristic.
      - path: /data/builds-manifest.json
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Static game-balance lookup; changes only with a data regen.
      - path: /data/unit-balance-lite.json
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
      # The parser worker + its bundle are loaded by importScripts()/new Worker()
      # WITHOUT a ?v= query (can't self-reference the hash), so they must keep a
      # revalidating TTL rather than being immutable. They change rarely.
      - path: /js/parser-worker.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Loaded via new Worker() without a ?v= query (can't self-reference the
      # hash), so it revalidates rather than being immutable. Changes rarely.
      - path: /js/replay-json-worker.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /js/vendor/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # The asset manifest itself is the index of hashes — never cache it.
      - path: /asset-manifest.json
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Keep the non-content pages out of the index at the HTTP layer as well
      # as in a meta tag. The header is the belt: it reaches non-HTML files, it
      # survives a page being served to a crawler that stops reading before
      # </head>, and it cannot be lost when someone edits a template. /dev/* is
      # the model/FX bench rig — it was fully public and indexable until now.
      - path: /dev/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /handoff.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /compare.html
        name: X-Robots-Tag
        value: noindex
      # Per-user replay library. Already noindex in the meta tag; the sitemap
      # entry contradicting that is removed in the generated sitemap.
      - path: /replays.html
        name: X-Robots-Tag
        value: noindex
      # ── Orphans: paths deleted from the repo that Render still serves ──────
      # Measured 2026-08-11: Render's static publish is ADDITIVE. A file removed
      # from client/ stays reachable on the live site after the deploy that
      # removed it, and even a `routes:` entry deleted from this file keeps
      # firing. Header rules, by contrast, apply immediately. So until someone
      # runs a "Clear build cache & deploy" from the Render dashboard, the only
      # lever over already-deleted content is a header.
      #
      # These paths no longer exist in git. They are the pre-move locations of
      # the /dev/* bench pages, a 478 KB debug dump, and a folder of 2021 GIFs.
      # DELETE THIS BLOCK once a clean publish has actually dropped them —
      # verify with `curl -o /dev/null -w '%{http_code}' https://wc3v.com/gridtest`
      # returning 404.
      - path: /test-fx.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /test-unit.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /test-building.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /model-scale-calibration.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /dominance-lab.html
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /gridtest
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /tutorial/*
        name: X-Robots-Tag
        value: noindex, nofollow
      # ── What Render actually does (measured 2026-08-11, commit 7ad3b3a) ────
      # Seven questions the agent-discovery work depended on. Answers, so the
      # next person does not have to redeploy to find out:
      #
      #   client/.well-known/ survives the publish ................. YES
      #   nested client/.well-known/mcp/ survives .................. YES
      #   `headers:` can override an inferred Content-Type ......... YES (cleanly
      #       replaces it, does not append a second header — see the rule below)
      #   .md files are served as ................................... text/markdown; charset=utf-8
      #   404.html is auto-served on a miss, with a real 404 status . YES
      #   `type: rewrite` with a leading dot in the source .......... NO (404)
      #   `type: redirect` from a path that EXISTS on disk .......... NO — see below
      #
      # The last one is the load-bearing one. Render resolves a static file
      # FIRST, including its clean-URL fallback (/foo serves foo.html), and only
      # consults `routes:` when nothing resolves. That is why the R2 redirects
      # below work (those paths are gitignored, nothing is on disk) and why a
      # `/about.html -> /about` redirect silently does nothing. Extensionless URL
      # normalization therefore cannot happen here; it needs a Cloudflare
      # Redirect Rule at the edge, which runs before the origin is reached.
      #
      # Render types extensionless files as binary/octet-stream, so RFC 9727's
      # required media type has to be forced. This rule is what makes
      # /.well-known/api-catalog servable from a static host at all.
      - path: /.well-known/api-catalog
        name: Content-Type
        value: application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"
      # RFC 9727 §2: a HEAD on the catalog must answer with a Link header
      # carrying the relation. Render answers HEAD from the same rules as GET.
      - path: /.well-known/api-catalog
        name: Link
        value: <https://wc3v.com/.well-known/api-catalog>; rel="api-catalog"
      # ── The install one-liner ─────────────────────────────────────────────
      # `irm https://wc3v.com/install.ps1 | iex`. Render types .ps1 as
      # application/octet-stream, and Invoke-RestMethod hands back a byte array
      # rather than a string for that type, which makes `| iex` fail in a way
      # that reads like the script is broken. Forcing text/plain is what makes
      # the one-liner work at all. Same lever as the api-catalog rule above.
      #
      # Deliberately NOT a Worker route: this is a constant header on one URL,
      # and workers/edge/src/index.js says constants belong here.
      - path: /install.ps1
        name: Content-Type
        value: text/plain; charset=utf-8
      # Short TTL so a fix to the installer reaches people promptly. It is a
      # few KB fetched once per install.
      - path: /install.ps1
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # Not a page. It is linked from /download, which is the indexable surface.
      - path: /install.ps1
        name: X-Robots-Tag
        value: noindex
      # ── Agent discovery, RFC 8288 ─────────────────────────────────────────
      # Static, identical on every page, so it belongs here rather than in a
      # Worker: there is no reason to spend an edge invocation on a constant.
      # Only registered relations, and every target resolves — an api-catalog
      # or service-desc pointing at a 404 is worse than not advertising one.
      # The per-page `rel="alternate"` link to each page's .md twin is in the
      # page's own <head>, since it varies per URL.
      - path: /*.html
        name: Link
        value: </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc"; type="application/openapi+json", </api>; rel="service-doc"; type="text/html", </sitemap.xml>; rel="sitemap"; type="application/xml"
      - path: /
        name: Link
        value: </llms.txt>; rel="describedby"; type="text/markdown", </.well-known/api-catalog>; rel="api-catalog", </api/openapi.json>; rel="service-desc"; type="application/openapi+json", </api>; rel="service-doc"; type="text/html", </sitemap.xml>; rel="sitemap"; type="application/xml"
      # ── CORS for the machine-readable surfaces ────────────────────────────
      # An agent fetching these from a browser context needs them readable
      # cross-origin. Read-only public JSON, so `*` is the correct value; the
      # HTML pages deliberately do not get it.
      - path: /.well-known/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /data/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /api/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /skills/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /llms.txt
        name: Access-Control-Allow-Origin
        value: "*"
      # Skill files are digest-verified by clients against the bytes served, so
      # a stale cached copy fails verification rather than degrading quietly.
      - path: /skills/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /.well-known/*
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /data/summaries-index.json
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /api/openapi.json
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      # The markdown twins revalidate with their HTML counterparts.
      - path: /*.md
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /llms.txt
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /llms-full.txt
        name: Cache-Control
        value: public, max-age=300, must-revalidate
    routes:
      # Heavy assets are hosted on R2 at cdn.wc3v.com. The client code uses
      # root-relative paths (e.g. /assets/wc3icons/foo.jpg, /maps/X/map.jpg)
      # so they "just work" in dev — these 301 redirects send production
      # traffic to R2. Browsers cache the redirect, so per-asset overhead
      # is one extra hop on first request only.
      - type: redirect
        source: /assets/wc3icons/*
        destination: https://cdn.wc3v.com/assets/wc3icons/*
      - type: redirect
        source: /assets/models/*
        destination: https://cdn.wc3v.com/assets/models/*
      - type: redirect
        source: /assets/textures/*
        destination: https://cdn.wc3v.com/assets/textures/*
      - type: redirect
        source: /assets/terrain/*
        destination: https://cdn.wc3v.com/assets/terrain/*
      - type: redirect
        source: /assets/press/*
        destination: https://cdn.wc3v.com/assets/press/*
      - type: redirect
        source: /maps/*
        destination: https://cdn.wc3v.com/maps/*
      - type: redirect
        source: /replays/*
        destination: https://cdn.wc3v.com/replays/*
